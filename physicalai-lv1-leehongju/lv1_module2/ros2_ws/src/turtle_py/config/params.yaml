# 1. 상태 발행자 노드 (/turtle_distance_publisher)
turtle_distance_publisher:
  ros__parameters:
    publish_rate: 10.0        # [double / Hz] /turtle_distance 토픽 발행 주기

# 2. 경고 구독자 노드 (/turtle_distance_subscriber)
turtle_distance_subscriber:
  ros__parameters:
    topic: "turtle_distance"   # [string] 구독 대상 토픽 이름
    reliability: "best_effort" # [string] QoS Reliability 정책 (best_effort | reliable)
    history_depth: 10         # [int] 수신 버퍼 큐 크기
    warn_distance: 0.8        # [double / m] 원점 거리가 이 값을 초과하면 WARN 로그 출력 (실험 시 0.8로 변경)

# 3. 다각형 그리기 액션 서버 노드 (/polygon_action_server)
polygon_action_server:
  ros__parameters:
    linear_speed: 1.0           # [double / m/s] 직선 이동 직진 속도
    angular_speed: 1.0          # [double / rad/s] 꼭짓점 제자리 회전 각속도
    control_rate: 20.0          # [double / Hz] 제어 루프 및 Cancel 감지 주기
    segment_timeout_factor: 3.0 # [double] 한 변 이동 이론상 소요 시간 대비 Abort 타임아웃 배율

# 4. 네임스페이스 노드 설정 (/turtle2/turtle_distance_publisher)
# spawn_second:=true 옵션으로 실행 시 생성되는 turtle2 네임스페이스 내부 노드 설정
turtle2:
  turtle_distance_publisher:
    ros__parameters:
      publish_rate: 5.0         # [double / Hz] 두 번째 거북이의 발행 주기를 5Hz로 다르게 설정